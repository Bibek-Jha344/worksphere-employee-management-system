version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: worksphere_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worksphere_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: worksphere-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/worksphere_dev?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET before starting the app}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET before starting the app}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
